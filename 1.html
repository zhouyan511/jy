<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Time Machine</title>
<style>
  body {
    margin: 0;
    background-color: #002fa7;
    font-family: "楷体", "STKaiti", "KaiTi", "KaiTi_GB2312", serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    height: 100vh;
    overflow: hidden;
    position: relative;
    color: #fff;
    cursor: pointer;
  }

  /* 星星背景 */
  .stars {
    position: absolute;
    top: 0; left: 0;
    width: 100%; height: 100%;
    background: transparent;
    overflow: hidden;
    z-index: 0;
  }
  .star {
    position: absolute;
    background: white;
    border-radius: 50%;
    opacity: 0.8;
    width: 2px;
    height: 2px;
    animation: twinkle 2s infinite ease-in-out;
  }
  @keyframes twinkle {
    0%, 100% { opacity: 0.8; }
    50% { opacity: 0.2; }
  }

  /* 黑胶持续旋转 */
  #vinyl {
    width: 300px;
    height: 300px;
    border-radius: 50%;
    background: radial-gradient(circle at center, #111 0%, #000 70%, #222 100%);
    box-shadow: inset 0 0 20px rgba(0,0,0,0.8);
    display: flex;
    align-items: center;
    justify-content: center;
    margin-bottom: 20px;
    /* 旋转动画持续 */
    animation: spin 20s linear infinite;
  }

  @keyframes spin {
    from {transform: rotate(0deg);}
    to {transform: rotate(360deg);}
  }

  /* 中心封面，换成新的图片链接 */
  .cover {
    width: 150px;
    height: 150px;
    background-image: url('https://zhouyan511.github.io/jy/2.jpg');
    background-size: cover;
    background-position: center;
    border-radius: 50%;
    box-shadow: 0 0 10px rgba(255,255,255,0.5);
  }

  /* 祝福文本 */
  .message {
    max-width: 700px;
    padding: 30px;
    background: rgba(255,255,255,0.05);
    border-radius: 10px;
    line-height: 1.8;
    font-family: "楷体", "STKaiti", "KaiTi", "KaiTi_GB2312", serif;
    font-size: 1.4em;
    color: #fff;
    white-space: pre-line;
    text-align: center;
  }

  /* 去除提示文字样式 */
</style>
</head>
<body>

<!-- 星星背景 -->
<div class="stars" id="stars"></div>

<!-- 去除“再点一下”的提示文本 -->

<!-- 背景音乐（尝试自动播放） -->
<audio id="bgMusic" src="https://zhouyan511.github.io/jy/1.mp3" loop autoplay></audio>

<!-- 黑胶 -->
<div id="vinyl">
  <div class="cover"></div>
</div>

<!-- 祝福 -->
<div class="message">
二十岁生日快乐，鲸鱼。<br>
愿你天天开心，岁岁岁平安。<br>
我会一直在这。
</div>

<script>
  // 生成星空
  const starContainer = document.getElementById('stars');
  for (let i=0; i<100; i++) {
    const star = document.createElement('div');
    star.className = 'star';
    star.style.top = Math.random() * 100 + '%';
    star.style.left = Math.random() * 100 + '%';
    star.style.width = (Math.random() * 2 + 1) + 'px';
    star.style.height = star.style.width;
    star.style.animationDuration = (Math.random() * 2 + 1) + 's';
    star.style.opacity = Math.random() + 0.3;
    starContainer.appendChild(star);
  }

  const music = document.getElementById('bgMusic');

  // 页面任何地方点击
  document.body.addEventListener('click', () => {
    if (music.muted) {
      music.muted = false;
      music.play().catch(() => {
        alert('请允许播放音乐，或者点击页面解锁');
      });
    }
  });
</script>
</body>
</html>
